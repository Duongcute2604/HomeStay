<text x="95" y="389" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">Admin</text><ellipse cx="341" cy="82" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="86" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Xem lịch sử thanh toán</text><ellipse cx="341" cy="148" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="152" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Chọn phương thức thanh toán</text><ellipse cx="791" cy="148" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="791" y="152" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Kiểm tra đơn đã hoàn thành</text><ellipse cx="791" cy="214" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="791" y="218" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Chặn đổi khi phiếu đã thu tiền</text><ellipse cx="341" cy="280" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="284" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Lọc phiếu thu theo trạng thái</text><ellipse cx="791" cy="280" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="791" y="284" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Phân trang danh sách phiếu thu</text><ellipse cx="341" cy="346" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="350" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Xác nhận đã thu tiền</text><ellipse cx="791" cy="346" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="791" y="350" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Đối chiếu số tiền với đơn</text><ellipse cx="791" cy="412" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="791" y="416" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Ghi thời điểm thu tiền</text><ellipse cx="341" cy="478" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="482" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Đánh dấu thanh toán thất bại</text><text x="24" y="595" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">Ranh giới đã chốt: hệ thống chỉ GHI NHẬN phương thức khách chọn, không nối API cổng thanh toán nào. Không có màn hình quét mã hay trang cổng.</text><text x="24" y="612" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">Ba trạng thái phiếu thu: chờ thanh toán, đã thanh toán, thanh toán thất bại.</text><text x="24" y="629" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">Phiếu thu mở khi đơn chuyển COMPLETED, không phải lúc khách đặt — khách chưa trả tiền thì chưa có giao dịch.</text><text x="24" y="646" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">Một đơn có đúng một phiếu thu (ràng buộc UNIQUE trên BookingId); thu hai lần sẽ bị từ chối với mã 409.</text>
</svg>
