      fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round"/>
<text x="1220" y="208" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">Admin</text><line x1="1202" y1="148" x2="524" y2="235" stroke="#374151" stroke-width="1.1"/><ellipse cx="405" cy="151" rx="125" ry="31" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="405" y="155" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">Xem lịch sử thanh toán</text><ellipse cx="685" cy="151" rx="125" ry="31" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="685" y="155" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">Chọn phương thức thanh toán</text><ellipse cx="965" cy="151" rx="125" ry="31" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="965" y="155" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">Lọc phiếu thu theo trạng thái</text><ellipse cx="405" cy="235" rx="125" ry="31" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="405" y="239" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">Xác nhận đã thu tiền</text><ellipse cx="685" cy="235" rx="125" ry="31" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="685" y="239" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">Đánh dấu thanh toán thất bại</text><text x="30" y="314" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">Ranh giới đã chốt: hệ thống chỉ GHI NHẬN phương thức khách chọn, không nối API cổng thanh toán nào. Không có màn hình quét mã hay trang cổng.</text><text x="30" y="332" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">Ba trạng thái phiếu thu: chờ thanh toán, đã thanh toán, thanh toán thất bại.</text><text x="30" y="350" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">Phiếu thu mở khi đơn chuyển COMPLETED, không phải lúc khách đặt — khách chưa trả tiền thì chưa có giao dịch.</text><text x="30" y="368" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">Một đơn có đúng một phiếu thu (ràng buộc UNIQUE trên BookingId); thu hai lần sẽ bị từ chối với mã 409.</text>
</svg>
