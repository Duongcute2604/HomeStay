<text x="150" y="208" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">Khách</text><line x1="168" y1="148" x2="286" y2="151" stroke="#374151" stroke-width="1.1"/><line x1="168" y1="148" x2="566" y2="151" stroke="#374151" stroke-width="1.1"/><circle cx="1220" cy="142" r="7" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
<path d="M 1220 149 L 1220 172 M 1208 158 L 1220 162 L 1232 158
