<text x="791" y="152" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Lọc và sắp xếp kết quả</text><ellipse cx="341" cy="214" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="218" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Xem chi tiết phòng</text><ellipse cx="791" cy="214" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="791" y="218" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Xem ảnh và tiện nghi</text><ellipse cx="341" cy="280" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
