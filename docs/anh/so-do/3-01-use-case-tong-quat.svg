<text x="341" y="482" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Xem đơn của tôi</text><ellipse cx="791" cy="478" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="791" y="482" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Xem lịch sử trạng thái đơn</text><ellipse cx="341" cy="544" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
