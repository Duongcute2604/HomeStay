<text x="791" y="548" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Kiểm tra đơn đã hoàn thành</text><ellipse cx="341" cy="610" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
