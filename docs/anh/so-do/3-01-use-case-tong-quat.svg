<text x="791" y="284" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Kiểm tra phòng còn trống</text><ellipse cx="791" cy="346" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
