<text x="341" y="680" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Chọn phương thức thanh toán</text><ellipse cx="341" cy="742" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="746" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Xem thông báo</text><ellipse cx="341" cy="808" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="812" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Quản lý hồ sơ</text><ellipse cx="341" cy="874" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="878" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Thống kê doanh thu</text><ellipse cx="791" cy="874" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="791" y="878" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Tổng hợp phiếu thu đã thu</text><ellipse cx="341" cy="940" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="944" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Quản lý đơn đặt phòng</text><ellipse cx="791" cy="940" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="791" y="944" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Ghi lịch sử chuyển trạng thái</text><ellipse cx="341" cy="1006" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="1010" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Quản lý phòng</text><ellipse cx="791" cy="1006" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="791" y="1010" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Cập nhật điểm đánh giá phòng</text><ellipse cx="341" cy="1072" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="1076" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Quản lý cơ sở</text><ellipse cx="341" cy="1138" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="1142" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Quản lý thanh toán</text><ellipse cx="791" cy="1138" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="791" y="1142" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Đối chiếu số tiền với đơn</text><ellipse cx="341" cy="1204" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="1208" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Quản lý đánh giá</text><ellipse cx="341" cy="1270" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="1274" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Quản lý khách hàng</text><text x="24" y="1387" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">Hai tác nhân duy nhất của hệ thống: Khách (CUSTOMER) và Admin (ADMIN).</text><text x="24" y="1404" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">Mọi chức năng vận hành — xác nhận đơn, check-in, check-out, đổi trạng thái phòng, xác nhận đã thu tiền — thuộc Admin.</text><text x="24" y="1421" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">Ranh giới đã chốt: hệ thống chỉ ghi nhận phương thức thanh toán, KHÔNG nối API cổng thanh toán; thông báo chỉ hiển thị trong hệ thống, không gửi email/SMS.</text>
