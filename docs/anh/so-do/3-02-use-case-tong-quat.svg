<text x="965" y="575" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">Quản lý khách hàng</text><text x="30" y="650" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">Hai tác nhân duy nhất của hệ thống: Khách (CUSTOMER) và Admin (ADMIN).</text><text x="30" y="668" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">Mọi chức năng vận hành — xác nhận đơn, check-in, check-out, đổi trạng thái phòng, xác nhận đã thu tiền — thuộc Admin.</text><text x="30" y="686" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">Hệ thống chỉ ghi nhận phương thức thanh toán, KHÔNG nối API cổng thanh toán; thông báo chỉ hiển thị trong hệ thống, không gửi email/SMS.</text>
