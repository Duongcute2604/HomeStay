<text x="150" y="173" font-size="22" text-anchor="middle" fill="#7c3aed" font-weight="400">⚙</text>
<text x="150" y="210" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">Hệ thống</text><line x1="196" y1="148" x2="286" y2="151" stroke="#374151" stroke-width="1.1"/><circle cx="1220" cy="142" r="7" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
<path d="M 1220 149 L 1220 172 M 1208 158 L 1220 162 L 1232 158
         M 1220 172 L 1210 190 M 1220 172 L 1230 190"
      fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round"/>
<text x="1220" y="208" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">Khách</text><line x1="1202" y1="148" x2="804" y2="151" stroke="#374151" stroke-width="1.1"/><line x1="1202" y1="148" x2="1084" y2="151" stroke="#374151" stroke-width="1.1"/><line x1="1202" y1="148" x2="524" y2="235" stroke="#374151" stroke-width="1.1"/><ellipse cx="405" cy="151" rx="125" ry="31" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="405" y="155" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">Sinh thông báo khi đổi trạng thái</text>
<text x="405" y="170" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">đơn</text><ellipse cx="685" cy="151" rx="125" ry="31" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="685" y="155" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">Xem thông báo</text><ellipse cx="965" cy="151" rx="125" ry="31" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="965" y="155" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">Đánh dấu đã đọc</text><ellipse cx="405" cy="235" rx="125" ry="31" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="405" y="239" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">Đánh dấu đã đọc tất cả</text><text x="30" y="314" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">Thông báo CHỈ hiển thị trong hệ thống (in-app), không gửi email/SMS — không có dịch vụ gửi tin nào trong dự án.</text><text x="30" y="332" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">Sinh thông báo cho 4 sự kiện: đơn được xác nhận, nhận phòng, trả phòng, bị từ chối (kèm lý do).</text><text x="30" y="350" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">Mỗi thông báo luôn chứa mã đơn để khách tra cứu được ngay.</text><text x="30" y="368" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">Khách tự huỷ đơn thì không sinh thông báo — chính họ biết, gửi thêm chỉ làm nhiễu.</text>
</svg>
