<text x="95" y="290" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">Khách</text><ellipse cx="341" cy="82" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="86" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Sinh thông báo khi đổi trạng</text>
<text x="341" y="101" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">thái đơn</text><ellipse cx="791" cy="82" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="791" y="86" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Sinh câu chữ theo trạng thái đơn</text><ellipse cx="341" cy="148" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="152" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Xem thông báo</text><ellipse cx="791" cy="148" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="791" y="152" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Đếm số thông báo chưa đọc</text><ellipse cx="341" cy="214" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="218" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Đánh dấu đã đọc</text><ellipse cx="341" cy="280" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="284" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Đánh dấu đã đọc tất cả</text><ellipse cx="791" cy="280" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="791" y="284" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Đánh dấu từng thông báo đã đọc</text><text x="24" y="397" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">Thông báo CHỈ hiển thị trong hệ thống (in-app), không gửi email/SMS — không có dịch vụ gửi tin nào trong dự án.</text><text x="24" y="414" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">Sinh thông báo cho 4 sự kiện: đơn được xác nhận, nhận phòng, trả phòng, bị từ chối (kèm lý do).</text><text x="24" y="431" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">Mỗi thông báo luôn chứa mã đơn để khách tra cứu được ngay.</text><text x="24" y="448" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">Khách tự huỷ đơn thì không sinh thông báo — chính họ biết, gửi thêm chỉ làm nhiễu.</text>
</svg>
