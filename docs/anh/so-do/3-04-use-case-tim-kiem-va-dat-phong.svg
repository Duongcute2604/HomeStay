<text x="791" y="482" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Ghi mã đơn và trả về khách</text><text x="24" y="595" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">Quy tắc nghiệp vụ: đặt theo giờ tối thiểu 3 giờ; đặt theo ngày nhận phòng 14:00, trả phòng 12:00 hôm sau; phải đặt trước ít nhất 2 giờ.</text><text x="24" y="612" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">Kiểm tra phòng trống chạy trong transaction mức SERIALIZABLE nên hai khách cùng đặt một khung giờ chỉ có một đơn được tạo.</text>
