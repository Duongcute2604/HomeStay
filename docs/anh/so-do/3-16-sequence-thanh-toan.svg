12" width="136.8" height="14" fill="#ffffff"/><text x="240" y="122" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: GET /api/payments/my</text><line x1="340" y1="180" x2="540" y2="180" stroke="#374151" stroke-width="1.2"/><polygon points="540,180 532.6,176.6 532.6,183.4" fill="#374151"/><rect x="366.0" y="166" width="148.0" height="14" fill="#ffffff"/><text x="440" y="176" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: LayCuaToiAsync(userId)</text><line x1="540" y1="234" x2="1340" y2="234" stroke="#374151" stroke-width="1.2"/><polygon points="1340,234 1332.6,230.6 1332.6,237.4" fill="#374151"/><rect x="810.0" y="220" width="260.0" height="14" fill="#ffffff"/><text x="940" y="230" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: SELECT Payments JOIN Bookings WHERE UserId</text><line x1="1340" y1="288" x2="540" y2="288" stroke="#374151" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="540,288 547.4,284.6 547.4,291.4" fill="#374151"/><rect x="854.8" y="274" width="170.4" height="14" fill="#ffffff"/><text x="940" y="284" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">2: return danh sách phiếu thu</text><line x1="540" y1="342" x2="340" y2="342" stroke="#374151" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="340,342 347.4,338.6 347.4,345.4" fill="#374151"/><rect x="363.2" y="328" width="153.6" height="14" fill="#ffffff"/><text x="440" y="338" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">2: return List&lt;PaymentDto&gt;</text><line x1="340" y1="396" x2="140" y2="396" stroke="#374151" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="140,396 147.4,392.6 147.4,399.4" fill="#374151"/><rect x="132.4" y="382" width="215.2" height="14" fill="#ffffff"/><text x="240" y="392" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: return 200 OK + tổng đã thanh toán</text><line x1="140" y1="450" x2="340" y2="450" stroke="#374151" stroke-width="1.2"/><polygon points="340,450 332.6,446.6 332.6,453.4" fill="#374151"/><rect x="132.4" y="436" width="215.2" height="14" fill="#ffffff"/><text x="240" y="446" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: POST /api/payments/booking/{maDon}</text><line x1="340" y1="504" x2="540" y2="504" stroke="#374151" stroke-width="1.2"/><polygon points="540,504 532.6,500.6 532.6,507.4" fill="#374151"/><rect x="310.0" y="490" width="260.0" height="14" fill="#ffffff"/><text x="440" y="500" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: ChonPhuongThucAsync(userId, maDon, yeuCau)</text><line x1="540" y1="558" x2="1340" y2="558" stroke="#374151" stroke-width="1.2"/><polygon points="1340,558 1332.6,554.6 1332.6,561.4" fill="#374151"/><rect x="821.2" y="544" width="237.6" height="14" fill="#ffffff"/><text x="940" y="554" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: Đơn phải COMPLETED và thuộc đúng khách</text><line x1="1340" y1="612" x2="540" y2="612" stroke="#374151" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="540,612 547.4,608.6 547.4,615.4" fill="#374151"/><rect x="860.4" y="598" width="159.2" height="14" fill="#ffffff"/><text x="940" y="608" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">2: return phiếu thu hiện có</text><path d="M 546 666 L 574 666 L 574 686 L 546 686" fill="none" stroke="#374151" stroke-width="1.1"/><polygon points="546,686 553,683 553,689" fill="#374151"/><rect x="580.0" y="650" width="220.8" height="14" fill="#ffffff"/><text x="580" y="660" font-size="11" text-anchor="start" fill="#1f2937" font-weight="400">3: Kiểm tra phiếu chưa đánh dấu đã thu</text><line x1="540" y1="720" x2="1340" y2="720" stroke="#374151" stroke-width="1.2"/><polygon points="1340,720 1332.6,716.6 1332.6,723.4" fill="#374151"/><rect x="821.2" y="706" width="237.6" height="14" fill="#ffffff"/><text x="940" y="716" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: INSERT Payments hoặc UPDATE phuongThuc</text><line x1="1340" y1="774" x2="540" y2="774" stroke="#374151" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="540,774 547.4,770.6 547.4,777.4" fill="#374151"/><rect x="902.4" y="760" width="75.2" height="14" fill="#ffffff"/><text x="940" y="770" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">4: return OK</text><line x1="540" y1="828" x2="340" y2="828" stroke="#374151" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="340,828 347.4,824.6 347.4,831.4" fill="#374151"/><rect x="380.0" y="814" width="120.0" height="14" fill="#ffffff"/><text x="440" y="824" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">2: return PaymentDto</text><line x1="340" y1="882" x2="140" y2="882" stroke="#374151" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="140,882 147.4,878.6 147.4,885.4" fill="#374151"/><rect x="107.2" y="868" width="265.6" height="14" fill="#ffffff"/><text x="240" y="878" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">2: return 200 OK — ghi nhận lựa chọn của khách</text><line x1="740" y1="936" x2="940" y2="936" stroke="#374151" stroke-width="1.2"/><polygon points="940,936 932.6,932.6 932.6,939.4" fill="#374151"/><rect x="721.2" y="922" width="237.6" height="14" fill="#ffffff"/><text x="840" y="932" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: GET /api/admin/payments?trangThai&amp;page</text><line x1="940" y1="990" x2="1140" y2="990" stroke="#374151" stroke-width="1.2"/><polygon points="1140,990 1132.6,986.6 1132.6,993.4" fill="#374151"/><rect x="907.2" y="976" width="265.6" height="14" fill="#ffffff"/><text x="1040" y="986" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: LayDanhSachAsync(trangThai, page, pageSize)</text><line x1="1140" y1="1044" x2="1340" y2="1044" stroke="#374151" stroke-width="1.2"/><polygon points="1340,1044 1332.6,1040.6 1332.6,1047.4" fill="#374151"/><rect x="1174.4" y="1030" width="131.2" height="14" fill="#ffffff"/><text x="1240" y="1040" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: SELECT … phân trang</text><line x1="1340" y1="1098" x2="1140" y2="1098" stroke="#374151" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="1140,1098 1147.4,1094.6 1147.4,1101.4" fill="#374151"/><rect x="1138.0" y="1084" width="204.0" height="14" fill="#ffffff"/><text x="1240" y="1094" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">2: return danh sách + tổng số trang</text><line x1="1140" y1="1152" x2="940" y2="1152" stroke="#374151" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="940,1152 947.4,1148.6 947.4,1155.4" fill="#374151"/><rect x="943.6" y="1138" width="192.8" height="14" fill="#ffffff"/><text x="1040" y="1148" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">2: return PagedResult&lt;PaymentDto&gt;</text><line x1="940" y1="1206" x2="740" y2="1206" stroke="#374151" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="740,1206 747.4,1202.6 747.4,1209.4" fill="#374151"/><rect x="743.6" y="1192" width="192.8" height="14" fill="#ffffff"/><text x="840" y="1202" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: return 200 OK — bảng phiếu thu</text><line x1="740" y1="1260" x2="940" y2="1260" stroke="#374151" stroke-width="1.2"/><polygon points="940,1260 932.6,1256.6 932.6,1263.4" fill="#374151"/><rect x="729.6" y="1246" width="220.8" height="14" fill="#ffffff"/><text x="840" y="1256" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">3: PATCH /api/admin/payments/{id}/paid</text><line x1="940" y1="1314" x2="1140" y2="1314" stroke="#374151" stroke-width="1.2"/><polygon points="1140,1314 1132.6,1310.6 1132.6,1317.4" fill="#374151"/><rect x="912.8" y="1300" width="254.4" height="14" fill="#ffffff"/><text x="1040" y="1310" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: DanhDauDaThuAsync(id, phuongThuc, ghiChu)</text><line x1="1140" y1="1368" x2="1340" y2="1368" stroke="#374151" stroke-width="1.2"/><polygon points="1340,1368 1332.6,1364.6 1332.6,1371.4" fill="#374151"/><rect x="1118.4" y="1354" width="243.2" height="14" fill="#ffffff"/><text x="1240" y="1364" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: Đối chiếu số tiền với tổng tiền của đơn</text><line x1="1340" y1="1422" x2="1140" y2="1422" stroke="#374151" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="1140,1422 1147.4,1418.6 1147.4,1425.4" fill="#374151"/><rect x="1168.8" y="1408" width="142.4" height="14" fill="#ffffff"/><text x="1240" y="1418" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">2: return khớp hoặc lệch</text><line x1="1140" y1="1476" x2="940" y2="1476" stroke="#374151" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="940,1476 947.4,1472.6 947.4,1479.4" fill="#374151"/><rect x="929.6" y="1462" width="220.8" height="14" fill="#ffffff"/><text x="1040" y="1472" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">4: return 400 "số tiền không khớp đơn"</text><line x1="1140" y1="1530" x2="1340" y2="1530" stroke="#374151" stroke-width="1.2"/><polygon points="1340,1530 1332.6,1526.6 1332.6,1533.4" fill="#374151"/><rect x="1084.8" y="1516" width="310.4" height="14" fill="#ffffff"/><text x="1240" y="1526" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: UPDATE Payments SET trangThai = DA_THU, thoiDiemThu</text><line x1="1340" y1="1584" x2="1140" y2="1584" stroke="#374151" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="1140,1584 1147.4,1580.6 1147.4,1587.4" fill="#374151"/><rect x="1202.4" y="1570" width="75.2" height="14" fill="#ffffff"/><text x="1240" y="1580" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: return OK</text><line x1="1140" y1="1638" x2="940" y2="1638" stroke="#374151" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="940,1638 947.4,1634.6 947.4,1641.4" fill="#374151"/><rect x="980.0" y="1624" width="120.0" height="14" fill="#ffffff"/><text x="1040" y="1634" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">5: return PaymentDto</text><line x1="940" y1="1692" x2="740" y2="1692" stroke="#374151" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="740,1692 747.4,1688.6 747.4,1695.4" fill="#374151"/><rect x="715.6" y="1678" width="248.8" height="14" fill="#ffffff"/><text x="840" y="1688" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: return 200 OK — doanh thu tăng tương ứng</text><text x="20" y="1754" font-size="11" text-anchor="start" fill="#1f2937" font-weight="400">Mũi tên liền = lời gọi · nét đứt = trả về · thanh xanh dọc đường đời = đối tượng đang xử lý.</text>
