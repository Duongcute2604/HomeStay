<text x="405" y="155" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">Xem danh sách đơn</text><ellipse cx="685" cy="151" rx="125" ry="31" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="685" y="155" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">Lọc &amp; tìm đơn</text><ellipse cx="965" cy="151" rx="125" ry="31" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="965" y="155" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">Xem đơn của tôi</text><ellipse cx="405" cy="235" rx="125" ry="31" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="405" y="239" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">Lọc đơn theo trạng thái</text><ellipse cx="685" cy="235" rx="125" ry="31" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="685" y="239" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">Xem chi tiết &amp; lịch sử đơn</text><ellipse cx="965" cy="235" rx="125" ry="31" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="965" y="239" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">Xác nhận đơn</text><ellipse cx="405" cy="319" rx="125" ry="31" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
