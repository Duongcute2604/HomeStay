<text x="341" y="614" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Check-in</text><ellipse cx="791" cy="610" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="791" y="614" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Chuyển phòng sang đang ở</text><ellipse cx="341" cy="676" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="680" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Check-out</text><ellipse cx="791" cy="676" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="791" y="680" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Mở phiếu thu cho đơn</text><ellipse cx="341" cy="742" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="746" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Đánh giá sau khi hoàn thành</text><ellipse cx="791" cy="742" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="791" y="746" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Chỉ cho đánh giá đơn COMPLETED</text><text x="24" y="859" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">Vòng đời đơn: PENDING → CONFIRMED → CHECKED_IN → COMPLETED; nhánh phụ CANCELLED (khách huỷ) và REJECTED (Admin từ chối).</text><text x="24" y="876" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">Mỗi lần đổi trạng thái đều ghi thêm một dòng vào bảng lịch sử, kèm người thực hiện và thời điểm.</text><text x="24" y="893" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">Khi đơn chuyển sang COMPLETED, hệ thống mở phiếu thu và sinh thông báo cho khách — xem Hình 3.7 và 3.8.</text>
