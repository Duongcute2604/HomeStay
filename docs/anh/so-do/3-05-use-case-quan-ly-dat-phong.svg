<text x="685" y="323" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">Huỷ đơn</text><ellipse cx="965" cy="319" rx="125" ry="31" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="965" y="323" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">Check-in</text><ellipse cx="405" cy="403" rx="125" ry="31" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="405" y="407" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">Check-out</text><ellipse cx="685" cy="403" rx="125" ry="31" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="685" y="407" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="400">Đánh giá sau khi hoàn thành</text><text x="30" y="482" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">Vòng đời đơn: PENDING → CONFIRMED → CHECKED_IN → COMPLETED; nhánh phụ CANCELLED (khách huỷ) và REJECTED (Admin từ chối).</text><text x="30" y="500" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">Mỗi lần đổi trạng thái đều ghi thêm một dòng vào bảng lịch sử, kèm người thực hiện và thời điểm.</text><text x="30" y="518" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">Khi đơn chuyển sang COMPLETED, hệ thống mở phiếu thu và sinh thông báo cho khách — xem Hình 3.7 và 3.8.</text>
</svg>
