<text x="341" y="350" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Xem chi tiết &amp; lịch sử đơn</text><ellipse cx="791" cy="346" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="791" y="350" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Tải dòng lịch sử chuyển trạng</text>
<text x="791" y="365" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">thái</text><ellipse cx="341" cy="412" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="341" y="416" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Xác nhận đơn</text><ellipse cx="791" cy="412" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
<text x="791" y="416" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="400">Kiểm tra trạng thái đơn hợp lệ</text><ellipse cx="341" cy="478" rx="125" ry="26" fill="#fbf7d5" stroke="#1f2937" stroke-width="1.5"/>
