kInAsync(maDon, adminId)</text><line x1="540" y1="234" x2="940" y2="234" stroke="#374151" stroke-width="1.2"/><polygon points="940,234 932.6,230.6 932.6,237.4" fill="#374151"/><rect x="660.4" y="220" width="159.2" height="14" fill="#ffffff"/><text x="740" y="230" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: BEGIN — mức SERIALIZABLE</text><path d="M 546 288 L 574 288 L 574 308 L 546 308" fill="none" stroke="#374151" stroke-width="1.1"/><polygon points="546,308 553,305 553,311" fill="#374151"/><rect x="580.0" y="272" width="176.0" height="14" fill="#ffffff"/><text x="580" y="282" font-size="11" text-anchor="start" fill="#1f2937" font-weight="400">2: Kiểm tra đơn đang CONFIRMED</text><line x1="540" y1="342" x2="940" y2="342" stroke="#374151" stroke-width="1.2"/><polygon points="940,342 932.6,338.6 932.6,345.4" fill="#374151"/><rect x="610.0" y="328" width="260.0" height="14" fill="#ffffff"/><text x="740" y="338" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: UPDATE Bookings SET trangThai = CHECKED_IN</text><line x1="540" y1="396" x2="940" y2="396" stroke="#374151" stroke-width="1.2"/><polygon points="940,396 932.6,392.6 932.6,399.4" fill="#374151"/><rect x="624.0" y="382" width="232.0" height="14" fill="#ffffff"/><text x="740" y="392" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">2: UPDATE Rooms SET trangThai = OCCUPIED</text><line x1="540" y1="450" x2="940" y2="450" stroke="#374151" stroke-width="1.2"/><polygon points="940,450 932.6,446.6 932.6,453.4" fill="#374151"/><rect x="652.0" y="436" width="176.0" height="14" fill="#ffffff"/><text x="740" y="446" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">3: INSERT BookingStatusHistory</text><line x1="540" y1="504" x2="740" y2="504" stroke="#374151" stroke-width="1.2"/><polygon points="740,504 732.6,500.6 732.6,507.4" fill="#374151"/><rect x="571.6" y="490" width="136.8" height="14" fill="#ffffff"/><text x="640" y="500" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: Tao(don, CHECKED_IN)</text><line x1="740" y1="558" x2="540" y2="558" stroke="#374151" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="540,558 547.4,554.6 547.4,561.4" fill="#374151"/><rect x="557.6" y="544" width="164.8" height="14" fill="#ffffff"/><text x="640" y="554" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">3: return tiêu đề + nội dung</text><line x1="540" y1="612" x2="940" y2="612" stroke="#374151" stroke-width="1.2"/><polygon points="940,612 932.6,608.6 932.6,615.4" fill="#374151"/><rect x="638.0" y="598" width="204.0" height="14" fill="#ffffff"/><text x="740" y="608" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: INSERT Notifications (daDoc = 0)</text><line x1="940" y1="666" x2="540" y2="666" stroke="#374151" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="540,666 547.4,662.6 547.4,669.4" fill="#374151"/><rect x="702.4" y="652" width="75.2" height="14" fill="#ffffff"/><text x="740" y="662" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">4: return OK</text><line x1="540" y1="720" x2="940" y2="720" stroke="#374151" stroke-width="1.2"/><polygon points="940,720 932.6,716.6 932.6,723.4" fill="#374151"/><rect x="710.8" y="706" width="58.4" height="14" fill="#ffffff"/><text x="740" y="716" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: COMMIT</text><line x1="540" y1="774" x2="340" y2="774" stroke="#374151" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="340,774 347.4,770.6 347.4,777.4" fill="#374151"/><rect x="366.0" y="760" width="148.0" height="14" fill="#ffffff"/><text x="440" y="770" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">2: return AdminBookingDto</text><line x1="340" y1="828" x2="140" y2="828" stroke="#374151" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="140,828 147.4,824.6 147.4,831.4" fill="#374151"/><rect x="191.2" y="814" width="97.6" height="14" fill="#ffffff"/><text x="240" y="824" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: return 200 OK</text><line x1="140" y1="882" x2="340" y2="882" stroke="#374151" stroke-width="1.2"/><polygon points="340,882 332.6,878.6 332.6,885.4" fill="#374151"/><rect x="115.6" y="868" width="248.8" height="14" fill="#ffffff"/><text x="240" y="878" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: PATCH /api/admin/bookings/{ma}/check-out</text><line x1="540" y1="936" x2="940" y2="936" stroke="#374151" stroke-width="1.2"/><polygon points="940,936 932.6,932.6 932.6,939.4" fill="#374151"/><rect x="612.8" y="922" width="254.4" height="14" fill="#ffffff"/><text x="740" y="932" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: UPDATE Bookings SET trangThai = COMPLETED</text><line x1="540" y1="990" x2="940" y2="990" stroke="#374151" stroke-width="1.2"/><polygon points="940,990 932.6,986.6 932.6,993.4" fill="#374151"/><rect x="624.0" y="976" width="232.0" height="14" fill="#ffffff"/><text x="740" y="986" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">2: UPDATE Rooms SET trangThai = CLEANING</text><line x1="540" y1="1044" x2="940" y2="1044" stroke="#374151" stroke-width="1.2"/><polygon points="940,1044 932.6,1040.6 932.6,1047.4" fill="#374151"/><rect x="629.6" y="1030" width="220.8" height="14" fill="#ffffff"/><text x="740" y="1040" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">3: INSERT Payments (chờ thu, tiền mặt)</text><line x1="540" y1="1098" x2="740" y2="1098" stroke="#374151" stroke-width="1.2"/><polygon points="740,1098 732.6,1094.6 732.6,1101.4" fill="#374151"/><rect x="574.4" y="1084" width="131.2" height="14" fill="#ffffff"/><text x="640" y="1094" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="400">1: Tao(don, COMPLETED)</text><line x1="540" y1="1152" x2="940" y2="1152" stroke="#374151" stroke-width="1.2"/><polygon point