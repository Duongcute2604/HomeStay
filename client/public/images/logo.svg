<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Logo HomeStay">
  <!--
    Logo HomeStay: mái nhà màu hổ phách trên nền kem, cửa tròn xanh mát.
    Vẽ bằng SVG thay vì ảnh bitmap để (1) không lo bản quyền ảnh chụp,
    (2) luôn sắc nét mọi kích thước, (3) đổi màu theo theme chỉ sửa 1 chỗ.
    Màu khớp `client/src/index.css`: amber-600 #d97706, amber-50 #fffbeb,
    sky-700 #0369a1.
  -->
  <rect width="64" height="64" rx="14" fill="#fffbeb" />

  <!-- Mái nhà -->
  <path d="M32 10 L54 30 H10 Z" fill="#d97706" />

  <!-- Thân nhà -->
  <path d="M16 30 h32 v22 a2 2 0 0 1 -2 2 H18 a2 2 0 0 1 -2 -2 Z" fill="#fef3c7" />

  <!-- Cửa tròn (nắng tròn buổi sớm) -->
  <circle cx="32" cy="41" r="6" fill="#0369a1" />

  <!-- Bậu cửa -->
  <rect x="29.5" y="46" width="5" height="8" rx="1.5" fill="#d97706" />
</svg>
